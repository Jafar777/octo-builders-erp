# Runs on every push and pull request: lint, unit tests, a production build, then the
# browser tests (Gantt, roles, access) against a throwaway MongoDB.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MONGODB_URI: mongodb://localhost:27017/octa_ci
  JWT_SECRET: ci-only-secret-not-used-anywhere-else
  IMAGEKIT_ID: ci
  IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/ci
  IMAGEKIT_PUBLIC_KEY: ci
  IMAGEKIT_PRIVATE_KEY: ci
  NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/ci
  NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: ci
  RESEND_API_KEY: re_ci
  RESEND_FROM_EMAIL: ci@example.com
  PUSHER_APP_ID: "1"
  PUSHER_KEY: ci
  PUSHER_SECRET: ci
  PUSHER_CLUSTER: eu
  NEXT_PUBLIC_PUSHER_KEY: ci
  NEXT_PUBLIC_PUSHER_CLUSTER: eu
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: checks
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
